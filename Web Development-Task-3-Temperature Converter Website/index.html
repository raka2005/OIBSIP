<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" 
        content="width=device-width , initial-scale=1.0">
        <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    </head>
     <body>
        <div class="container">
            <div class="converter-card">
                <h1>TEMPERATURE CONVERTER</h1>
                <div class="form-group">
                    <label for="temperature">
                        ENTER TEMPERATURE
                    </label>
                    <input
                     type="number" id="temperature"
                     placeholder="Enter Temperature" step="any">
                </div>
                <div class="form-group">
                    <label for="unit">
                        SELECT INPUT UNIT
                    </label>
                    <select id="unit">
                        <option value="Celsius">
                            Celsius (°C)
                        </option>
                        <option value="Fahrenheit">
                            Fahrenheit (°F)
                        </option>
                        <option value="Kelvin">
                            Kelvin (K)
                        </option>
                    </select>
                </div>
                <button id="convertBtn">
                    CONVERT TEMPERATURE
                </button>
                <p id="errorMessage" class="error"></p>
                <div class="results">
                    <h2>CONVERTED TEMPERATURE</h2>
                    <div class="result-box">
                        <span>Celsius</span>
                        <strong id="celsiusResult">
                            -- °C
                        </strong>
                    </div>
                    <div class="result-box">
                        <span>Fahrenheit</span>
                        <strong id="fahrenheitResult">
                            -- °F
                        </strong>
                    </div>
                    <div class="result-box">
                        <span>Kelvin</span>
                        <strong id="kelvinResult">
                            -- K
                        </strong>
                    </div>
                </div>
            </div>
        </div>
    <script src="script.js"></script>
    </body>
</html>
